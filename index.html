<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Casino Spin Wheel</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at center, #1a1a1a, #000);
  color: #fff;
  text-align: center;
}

header {
  display: flex;
  justify-content: space-between;
  padding: 15px 20px;
  background: linear-gradient(90deg, #000, #111);
  border-bottom: 2px solid gold;
}

button {
  padding: 10px 20px;
  background: linear-gradient(45deg, gold, orange);
  border: none;
  cursor: pointer;
  font-weight: bold;
  border-radius: 6px;
}

input {
  padding: 10px;
  margin: 10px;
  border-radius: 5px;
  border: none;
}

canvas {
  margin-top: 20px;
  filter: drop-shadow(0 0 10px gold);
}

.pointer {
  width: 0;
  height: 0;
  border-left: 18px solid transparent;
  border-right: 18px solid transparent;
  border-bottom: 35px solid gold;
  margin: auto;
  filter: drop-shadow(0 0 8px gold);
}

.glow {
  animation: glow 1s infinite alternate;
}

@keyframes glow {
  from { filter: drop-shadow(0 0 5px gold); }
  to { filter: drop-shadow(0 0 20px gold); }
}
</style>
</head>

<body>
<div id="app">

<header>
  <div>{{ t("balance") }}: {{ balance }}</div>
  <button @click="switchLang">{{ lang.toUpperCase() }}</button>
</header>

<div class="pointer" :class="{glow: winEffect}"></div>
<canvas ref="canvas" width="320" height="320"></canvas>

<div>
  <input v-model.number="bet" type="number" />
  <button @click="spin" :disabled="spinning">
    {{ t("spin") }}
  </button>
</div>

<h2 v-if="result">{{ result }}</h2>

</div>

<script>
const { createApp, ref, onMounted } = Vue;

createApp({
setup() {

const canvas = ref(null);
const ctx = ref(null);

const lang = ref(localStorage.getItem("lang") || "fr");

const messages = {
  fr: {
    spin: "Tourner",
    balance: "Solde",
    win: "Gagné",
    lose: "Perdu",
    jackpot: "JACKPOT 💎"
  },
  en: {
    spin: "Spin",
    balance: "Balance",
    win: "Win",
    lose: "Lose",
    jackpot: "JACKPOT 💎"
  }
};

const t = (k) => messages[lang.value][k];

function switchLang() {
  lang.value = lang.value === "fr" ? "en" : "fr";
  localStorage.setItem("lang", lang.value);
}

const balance = ref(1000);
const bet = ref(50);
const spinning = ref(false);
const result = ref("");
const winEffect = ref(false);

const rewards = [
  { label: "10", value: 10, weight: 30 },
  { label: "50", value: 50, weight: 25 },
  { label: "100", value: 100, weight: 15 },
  { label: "0", value: 0, weight: 20 },
  { label: "CAR 🚗", value: "car", weight: 3 },
  { label: "MOTO 🏍️", value: "moto", weight: 4 },
  { label: "500", value: 500, weight: 2 },
  { label: "💎", value: 1000, weight: 1 }
];

// 🎯 Probabilité réaliste
function weightedRandom() {
  const total = rewards.reduce((sum, r) => sum + r.weight, 0);
  let rand = Math.random() * total;

  for (let r of rewards) {
    if (rand < r.weight) return r;
    rand -= r.weight;
  }
}

function drawWheel(angle = 0) {
  const c = ctx.value;
  const size = 320;
  const r = size / 2;
  const arc = (2 * Math.PI) / rewards.length;

  c.clearRect(0, 0, size, size);

  rewards.forEach((reward, i) => {
    const start = i * arc + angle;
    const end = start + arc;

    const gradient = c.createLinearGradient(0, 0, size, size);
    gradient.addColorStop(0, i % 2 ? "#c0392b" : "#f1c40f");
    gradient.addColorStop(1, "#000");

    c.beginPath();
    c.moveTo(r, r);
    c.arc(r, r, r, start, end);
    c.fillStyle = gradient;
    c.fill();

    // texte
    c.save();
    c.translate(r, r);
    c.rotate(start + arc / 2);
    c.fillStyle = "#fff";
    c.font = "bold 14px sans-serif";
    c.fillText(reward.label, r * 0.55, 0);
    c.restore();
  });
}

function spin() {
  if (spinning.value) return;
  if (bet.value <= 0 || bet.value > balance.value) return;

  spinning.value = true;
  result.value = "";
  winEffect.value = false;

  balance.value -= bet.value;

  const chosen = weightedRandom();
  const index = rewards.indexOf(chosen);

  const arc = 360 / rewards.length;
  const spins = 6;
  const target = spins * 360 + (360 - index * arc);

  let start = null;
  const duration = 4500;

  function animate(ts) {
    if (!start) start = ts;
    const progress = ts - start;

    const ease = 1 - Math.pow(1 - progress / duration, 4);
    const angle = ease * target;

    drawWheel(angle * Math.PI / 180);

    // effet tick
    if (progress % 100 < 16) {
      tick();
    }

    if (progress < duration) {
      requestAnimationFrame(animate);
    } else {
      spinning.value = false;

      if (typeof chosen.value === "number") {
        balance.value += chosen.value;

        if (chosen.value >= 500) {
          winEffect.value = true;
          playWin();
        }

        result.value = `${t("win")} ${chosen.value}`;
      } else if (chosen.value === "car" || chosen.value === "moto") {
        winEffect.value = true;
        playWin();
        result.value = chosen.label;
      } else {
        result.value = t("lose");
      }
    }
  }

  requestAnimationFrame(animate);
}

// 🔊 Sons
function tick() {
  const audio = new Audio("https://actions.google.com/sounds/v1/clicks/click.ogg");
  audio.volume = 0.2;
  audio.play();
}

function playWin() {
  const audio = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
  audio.volume = 0.5;
  audio.play();
}

onMounted(() => {
  ctx.value = canvas.value.getContext("2d");
  drawWheel();
});

return {
  canvas,
  balance,
  bet,
  spin,
  spinning,
  result,
  t,
  switchLang,
  lang,
  winEffect
};

}
}).mount("#app");
</script>

</body>
</html>
